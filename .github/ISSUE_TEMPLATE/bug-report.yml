name: Bug report
description: Report a reproducible problem with Upgrade Guard.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, access tokens, private site URLs, personal data,
        or unredacted scan exports. Report security vulnerabilities privately
        using the repository's Security tab, not in a public issue.
  - type: input
    id: moodle-version
    attributes:
      label: Moodle version
      placeholder: "For example, 5.2"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Upgrade Guard version
      placeholder: "For example, 0.9.2"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use fictional or anonymized site/plugin names where possible.
    validations:
      required: true
